<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMB AI</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b14;color:#fff;font-family:Arial,sans-serif}
    main{text-align:center;padding:40px;max-width:720px}
    h1{font-size:clamp(42px,8vw,76px);margin:0 0 14px}
    p{color:#aeb8cc;font-size:18px;line-height:1.6}
    .status{display:inline-block;margin-top:18px;padding:10px 16px;border:1px solid #26324a;border-radius:999px;background:#10182a;color:#7dd3fc}
  </style>
</head>
<body>
  <main>
    <h1>CMB AI</h1>
    <p>The CMB-AI GitHub Pages site is connected and ready. The repository deployment has been repaired.</p>
    <div class="status">GitHub Pages deployment ready</div>
  </main>
</body>
</html>
