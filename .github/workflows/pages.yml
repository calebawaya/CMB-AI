name: Deploy CMB AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify site entry
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f reactor.css
          echo "Required site files are present."

      - name: Validate all frontend JavaScript
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './backend/*' -print0)

      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.errors = []
                  self.stack = []
                  self.void = {
                      'area','base','br','col','embed','hr','img','input',
                      'link','meta','param','source','track','wbr'
                  }
              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag not in self.void:
                      self.stack.append(tag)
              def handle_startendtag(self, tag, attrs):
                  pass
              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag in self.void:
                      self.errors.append(f'Unexpected closing tag: </{tag}>')
                      return
                  if not self.stack:
                      self.errors.append(f'Unexpected closing tag: </{tag}>')
                      return
                  if self.stack[-1] != tag:
                      self.errors.append(
                          f'Mismatched closing tag: expected </{self.stack[-1]}> but found </{tag}>'
                      )
                      return
                  self.stack.pop()

          path = Path('index.html')
          parser = Parser()
          parser.feed(path.read_text(encoding='utf-8', errors='strict'))
          parser.close()
          if parser.stack:
              parser.errors.append('Unclosed tags: ' + ', '.join(parser.stack[-10:]))
          if parser.errors:
              print('HTML validation errors:')
              for error in parser.errors:
                  print(' -', error)
              sys.exit(1)
          print('HTML structure is valid.')
          PY

      - name: Validate local asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re
          import sys

          root = Path('.')
          files_to_scan = ['index.html', 'style.css', 'reactor.css']
          missing = []

          def check_ref(ref, source):
              ref = unquote(ref.strip())
              if not ref or ref.startswith(('#', 'http://', 'https://', '//', 'data:', 'mailto:', 'javascript:')):
                  return
              ref = ref.split('?', 1)[0].split('#', 1)[0]
              if not ref:
                  return
              path = root / ref.lstrip('/')
              if not path.is_file():
                  missing.append((source, ref))

          for filename in files_to_scan:
              path = root / filename
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8', errors='strict')
              for match in re.findall(r'(?:src|href)=["\']([^"\']+)["\']', text, re.I):
                  check_ref(match, filename)
              for match in re.findall(r'url\(\s*["\']?([^)"\']+)["\']?\s*\)', text, re.I):
                  check_ref(match, filename)

          if missing:
              print('Missing local assets:')
              for source, ref in sorted(set(missing)):
                  print(f' - {source}: {ref}')
              sys.exit(1)

          print('Local asset references are valid.')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
