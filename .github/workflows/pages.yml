name: Deploy CMB AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate required site files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f reactor.css
          test -f cmb-backend.js
          test -f cmb-ai-controls.js
          test -f cmb-ai-diff.js

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in script.js cmb-backend.js cmb-ai-controls.js cmb-ai-diff.js; do
            node --check "$file"
          done

      - name: Prepare Pages artifact
        run: |
          set -e
          rm -rf _site
          mkdir _site
          rsync -a --exclude=".git/" --exclude=".github/" --exclude="backend/" --exclude="_site/" ./ _site/
          test -f _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
