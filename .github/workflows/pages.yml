name: Deploy CMB AI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate required site files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f reactor.css
          test -f cmb-backend.js
          test -f cmb-ai-controls.js
          test -f cmb-ai-diff.js
          test -f cmb-ai-health-sync.js
          test -f cmb-github-sync.js
          test -f cmb-github-commit-link.js
          test -f cmb-github-remote-status.js

      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in script.js cmb-backend.js cmb-ai-controls.js cmb-ai-diff.js cmb-ai-health-sync.js cmb-github-sync.js cmb-github-commit-link.js cmb-github-remote-status.js; do
            node --check "$file"
          done

      - name: Prepare Pages artifact
        run: |
          set -e
          rm -rf _site
          mkdir _site
          rsync -a --exclude=".git/" --exclude=".github/" --exclude="backend/" --exclude="_site/" ./ _site/
          python - <<'PY'
          from pathlib import Path
          index = Path("_site/index.html")
          text = index.read_text(encoding="utf-8")
          health = '<script src="cmb-ai-health-sync.js"></script>'
          github = '<script src="cmb-github-sync.js"></script>'
          commit_link = '<script src="cmb-github-commit-link.js"></script>'
          remote_status = '<script src="cmb-github-remote-status.js"></script>'
          controls = '<script src="cmb-ai-controls.js"></script>'
          for script in (health, github, commit_link, remote_status):
              if script not in text:
                  marker = controls
                  if marker not in text:
                      raise SystemExit("cmb-ai-controls.js script tag not found")
                  text = text.replace(marker, script + "\n" + marker, 1)
          for script in (health, github, commit_link, remote_status):
              if text.index(script) > text.index(controls):
                  text = text.replace(script, "", 1)
                  text = text.replace(controls, script + "\n" + controls, 1)
          index.write_text(text, encoding="utf-8")
          PY
          test -f _site/index.html
          test -f _site/cmb-ai-health-sync.js
          test -f _site/cmb-github-sync.js
          test -f _site/cmb-github-commit-link.js
          test -f _site/cmb-github-remote-status.js
          python - <<'PY'
          from pathlib import Path
          text = Path("_site/index.html").read_text(encoding="utf-8")
          health = text.index('<script src="cmb-ai-health-sync.js"></script>')
          github = text.index('<script src="cmb-github-sync.js"></script>')
          commit_link = text.index('<script src="cmb-github-commit-link.js"></script>')
          remote_status = text.index('<script src="cmb-github-remote-status.js"></script>')
          controls = text.index('<script src="cmb-ai-controls.js"></script>')
          if any(pos >= controls for pos in (health, github, commit_link, remote_status)):
              raise SystemExit("CMB AI support scripts must load before AI controls")
          if not (health < github < commit_link < remote_status < controls):
              raise SystemExit("CMB AI script order is invalid")
          print("Verified: AI health sync, GitHub sync, commit link, and remote status load before AI controls")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
